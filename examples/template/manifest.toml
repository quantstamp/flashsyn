# =============================================================================
# FlashSyn benchmark manifest — copy this directory to examples/<your-name>/ and
# fill it in. The CLI builds the whole action model from this file; the only code
# you write is the Solidity harness next to it (attack.t.sol). See README.md here.
#
# Run it (from the repo root):
#   python3 flashsyn.py compile    <your-name>   # forge build — does the harness compile?
#   python3 flashsyn.py validate   <your-name>   # smoke-check each action runs (from the manifest)
#   python3 flashsyn.py collect    <your-name>   # sample the actions -> initialDataPoints/
#   python3 flashsyn.py synthesize <your-name> > run.log
#   python3 flashsyn.py deps       <your-name>   # diagnostic only: print a dependency graph
# =============================================================================

name = "template"          # benchmark id; also the initialDataPoints/<name>/ folder
contract = "Template"      # the contract name in attack.t.sol (forge --match-contract)
chain = "ETH"              # ETH | BSC | Fantom | Polygon  (endpoints in src/foundryModule/run.sh)
block = 12345678           # fork block, just before the exploit
max_synthesis_len = 5      # longest action sequence the synthesizer searches


# Which tokens count toward profit, in the SAME ORDER the derived profit readout prints them.
# profit = sum over these of (final_balance - initial_balance) * price.  (auto-derived)
profit_tokens = ["TOKENA", "TOKENB"]

# The capital the attacker starts with (as if the flash loan already happened).
# Must match what setUp() funds in the harness. Values are in whole tokens (no decimals).
[initial_balances]
TOKENA = 50000000
TOKENB = 20000000

# Price of each token of interest at the fork block. Stablecoins = 1.0; use real
# prices for volatile assets so cross-token profit is weighed correctly.
[token_prices]
TOKENA = 1.0
TOKENB = 1.0

# Every token an action touches -> [its contract variable in attack.t.sol, its decimals].
# The generated collector reads balanceOf(<var>) and emits the RAW amount; the parser scales
# by <decimals> in Python (one source of decimals — never in Solidity). A 3rd element
# "native" (e.g. ETH = ["", 18, "native"]) means the token has no ERC20 balanceOf, so the
# collector reads address(attacker).balance instead. Include every token an action moves
# (intermediate vault shares too), even if it isn't a profit token.
[token_info]
TOKENA = ["TOKENA", 6]
TOKENB = ["TOKENB", 6]
vTOKEN = ["VAULT", 18]   # a vault-share token whose variable happens to be named VAULT

# -----------------------------------------------------------------------------
# One [[actions]] block per protocol action. Order here defines the action list.
#
#   name        unique action name
#   tokens_in   tokens the attacker NET gives up across the whole snippet
#   tokens_out  tokens the attacker NET receives across the whole snippet
#   range       [min, max] search range for the parameter (whole-token units)
#   solidity    the Solidity the action runs. numInputs is inferred from the $$ count.
#
# $$ MECHANICS: each $$ becomes an INDEPENDENT search parameter (a, b, c, ...). If the
# same value is used in two calls, capture it once (uint amt = $$ * 1e6;) — writing $$
# twice would search two unrelated numbers. Zero $$ is fine (a fixed action).
# -----------------------------------------------------------------------------

# A single-call swap: one parameter.
[[actions]]
name = "swap_A_to_B"
tokens_in = ["TOKENA"]
tokens_out = ["TOKENB"]
range = [0, 20000000]
solidity = "POOL.exchange(0, 1, $$ * 1e6, 0);"

# A vault deposit: TOKENA in, vault shares out.
[[actions]]
name = "vault_deposit"
tokens_in = ["TOKENA"]
tokens_out = ["vTOKEN"]
range = [0, 50000000]
solidity = "VAULT.deposit($$ * 1e6);"

# A MULTI-CALL action. Any number of statements is allowed. Note the single $$ captured
# into `amt` and reused, so approve and swap use the SAME searched value (not two).
# Anything it references (ROUTER, path, block.timestamp) must exist in the harness.
[[actions]]
name = "approve_and_swap"
tokens_in = ["TOKENB"]
tokens_out = ["TOKENA"]
range = [0, 20000000]
solidity = """
        uint amt = $$ * 1e6;
        TOKENB.approve(address(ROUTER), amt);
        ROUTER.swapExactTokensForTokens(amt, 0, path, address(attacker), block.timestamp);
"""

# A vault withdraw: shares in, TOKENA out.
[[actions]]
name = "vault_withdraw"
tokens_in = ["vTOKEN"]
tokens_out = ["TOKENA"]
range = [0, 60000000]
solidity = "VAULT.withdraw($$);"

# ESCAPE HATCH: when an action doesn't fit "the $$ params are the consumed amounts and the
# outputs go to tokens_out", two things cover it — no Python. See examples/puppet & euler.
#
# 1. effects — declarative transit, replacing the default. op = add|sub|set, src = input
#    (the sole $$; inputN for multi) | collected (this token's own collected value) | a number
#    constant (e.g. 0, 5). Also drives the collector: each `collected` token, add -> gained
#    (after-before), sub -> spent (before-after).
# 2. inline measurement — when the collected value is an INTERNAL value (not a start-to-end
#    balance delta, e.g. borrow's collateral _dep), record it in `solidity` with a RAW
#    collect.spent/gained("<token>", value) call; the engine just adds collect.flush().
#
#   [[actions]]
#   name = "PoolBorrow"
#   tokens_in  = ["ETH"]      # flow only (for the search graph)
#   tokens_out = ["DVT"]
#   range = [0, 100000]
#   solidity = """
#       _amt = $$ * 1e18;
#       _dep = pool.calculateDepositRequired(_amt);
#       pool.borrow{value: _dep}(_amt);
#       collect.spent("ETH", _dep);"""              # <- inline collected value (raw)
#   effects = [
#     { token = "DVT", op = "add", src = "input" },      # received == the search parameter
#     { token = "ETH", op = "sub", src = "collected" },  # collateral == the recorded _dep
#   ]
